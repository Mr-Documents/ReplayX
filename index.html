<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReplayX</title>
  </head>
  <body>
    <h2>ReplayX <span id="status" class="status-pill">Idle</span></h2>

    <div id="error-banner" class="error-banner" role="alert" style="display: none"></div>

    <div class="controls">
      <button id="start-btn">Start Recording</button>
      <button id="pause-btn" disabled>Pause</button>
      <button id="resume-btn" disabled style="display: none">Resume</button>
      <button id="stop-btn" disabled>Stop Recording</button>
    </div>

    <div id="replay-controls" class="replay-controls" style="display: none">
      <div class="speed-row">
        <label for="speed-control">Replay Speed: <span id="speed-value">1x</span></label>
        <input type="range" id="speed-control" min="0.1" max="5" step="0.1" value="1" />
      </div>
      <div class="replay-actions">
        <button id="step-btn">Step</button>
        <button id="stop-replay-btn">Stop Replay</button>
        <span id="progress-label" class="progress-label"></span>
      </div>
      <div id="timeline" class="timeline">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <div class="sessions-header">
      <div class="sessions-title">Saved Sessions</div>
      <div>
        <input type="file" id="import-input" accept="application/json,.json" style="display: none" />
        <button id="import-btn" class="small-btn">Import</button>
      </div>
    </div>

    <div id="sessions" class="sessions-list"></div>

    <div id="session-debugger" class="session-debugger" style="display: none"></div>

    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
