<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReplayX</title>
  </head>
  <body>
    <h2>ReplayX <span id="status" style="font-size: 14px; color: #718096; font-weight: normal; float: right; margin-top: 2px;">Idle</span></h2>

    <div class="controls">
      <button id="start-btn">Start Recording</button>
      <button id="pause-btn" disabled>Pause</button>
      <button id="resume-btn" disabled style="display: none;">Resume</button>
      <button id="stop-btn" disabled>Stop Recording</button>
    </div>

    <div id="replay-controls" style="display: none; margin: 10px 0;">
      <div style="margin-bottom: 8px;">
        <label for="speed-control">Replay Speed: <span id="speed-value">1x</span></label>
        <input type="range" id="speed-control" min="0.1" max="5" step="0.1" value="1">
      </div>
      <div id="timeline" style="width: 100%; height: 20px; background: #e2e8f0; border-radius: 10px; position: relative;">
        <div id="progress-bar" style="height: 100%; background: #38a169; border-radius: 10px; width: 0%; transition: width 0.1s;"></div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
      <div style="font-size: 13px; font-weight: 600;">Saved Sessions</div>
      <div>
        <input type="file" id="import-input" accept=".json" style="display: none;">
        <button id="import-btn" style="font-size: 11px; padding: 4px 8px;">Import</button>
      </div>
    </div>

    <div id="sessions" class="sessions-list">
      <!-- Session items will populate here -->
    </div>

    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
