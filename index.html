<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReplayX MVP</title>
  </head>
  <body>
    <h2>ReplayX <span id="status" style="font-size: 14px; color: #718096; font-weight: normal; float: right; margin-top: 2px;">Idle</span></h2>

    <div class="controls">
      <button id="start-btn">Record Session</button>
      <button id="stop-btn" disabled>Stop Recording</button>
    </div>

    <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Saved Sessions</div>
    <div id="sessions" class="sessions-list">
      <!-- Session items will populate here -->
    </div>

    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
