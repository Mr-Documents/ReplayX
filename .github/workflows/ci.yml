name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous, still-running job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build extension
        run: npx vite build

      # Guards against the manifest and the built output drifting apart, which
      # produces an extension Chrome silently refuses to load.
      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/manifest.json
          test -f dist/index.html
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('expected Manifest V3');
            if (!manifest.background?.service_worker) throw new Error('missing service worker');
            const worlds = (manifest.content_scripts ?? []).map((entry) => entry.world ?? 'ISOLATED');
            if (!worlds.includes('MAIN')) throw new Error('missing MAIN-world interceptor');
            console.log('dist/manifest.json looks sane');
          "

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Upload built extension
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: replayx-extension
          path: dist/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dev-only tooling still ships nothing to users, but a high-severity
      # advisory in the build chain is worth failing on.
      - run: npm audit --audit-level=high
